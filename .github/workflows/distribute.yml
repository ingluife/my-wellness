name: Build & Distribute (Firebase App Distribution)

# Builds a release APK and pushes it to Firebase App Distribution.
#
# Manual trigger only (workflow_dispatch) — run from the Actions tab when
# you want to cut a build. See docs/ci-app-distribution.md for the one-time
# manual setup this workflow depends on (secrets, keystore, Firebase App ID,
# tester group).
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown to testers (optional)"
        required: false
        type: string

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the exercise media
        # assets/img and assets/gif (1,324 stills + 1,324 animations, ~121 MB packed)
        # are declared in pubspec.yaml but git-ignored, so a fresh checkout has neither
        # directory and `flutter build apk` fails. They are published as the
        # `media.tar.gz` asset on a release of this (private) repo — `gh` authenticates
        # with the built-in token, so no extra secret is needed. See
        # docs/ci-app-distribution.md and tool/sync_media.sh.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_RELEASE_TAG: ${{ vars.MEDIA_RELEASE_TAG || 'media-v1' }}
        run: |
          set -euo pipefail
          gh release download "$MEDIA_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern media.tar.gz \
            --output media.tar.gz
          mkdir -p assets
          tar -xzf media.tar.gz -C assets
          test "$(find assets/img -type f | wc -l)" -eq 1324
          test "$(find assets/gif -type f | wc -l)" -eq 1324

      - name: Fetch the food photography
        # Not a hard gate: every food falls back to its category glyph when its photo
        # is missing, and the source is a public API nobody here controls.
        continue-on-error: true
        run: |
          set -euo pipefail
          ./tool/sync_food_media.sh || true
          echo "food images: $(find assets/food -name '*.jpg' | wc -l)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true

      # Secrets referenced below must exist under Settings → Secrets and
      # variables → Actions before this workflow can succeed — see
      # docs/ci-app-distribution.md.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Write keystore properties
        # Passwords come in through env and are written with printf, not a heredoc: an
        # unquoted heredoc runs shell expansion over the value, so a password containing
        # $, `, \ or " would be silently mangled before Gradle ever saw it.
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > android/key.properties

      - name: Verify signing key
        # Fails here with a precise keytool message ("keystore password was incorrect",
        # "Cannot recover key", "Alias <x> does not exist") instead of six minutes later
        # inside :app:packageRelease. -certreq touches the private key, so it proves the
        # key password too, and writes nothing.
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -certreq -alias "$KEY_ALIAS" \
            -keystore android/app/release.keystore \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" > /dev/null
          echo "Signing key OK — store password, alias and key password all match."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Get latest commit message
        id: latest_commit
        run: |
          {
            echo 'message<<EOF'
            git log -1 --pretty=%B
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ inputs.release_notes || steps.latest_commit.outputs.message }}
