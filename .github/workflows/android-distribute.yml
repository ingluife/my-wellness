name: Android · build & distribute

# Every push to main produces a signed APK and hands it to Firebase App Distribution.
# workflow_dispatch is there for a release you want to name yourself.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      groups:
        description: Firebase App Distribution tester groups (comma-separated)
        default: testers
      notes:
        description: Release notes shown to testers
        default: Manual build

concurrency:
  group: android-distribute-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.9
  JAVA_VERSION: "17"

jobs:
  distribute:
    name: Build, sign and distribute
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the exercise media
        # The 1,324 stills and animations are ~137 MB and are not committed. They come from
        # the openGym checkout the app was translated from; the release that carries them is
        # the single source both apps share.
        run: |
          set -euo pipefail
          if [ -n "${{ vars.MEDIA_ARCHIVE_URL }}" ]; then
            curl -fsSL "${{ vars.MEDIA_ARCHIVE_URL }}" -o media.tar.gz
            mkdir -p assets
            tar -xzf media.tar.gz -C assets
          else
            git clone --depth 1 https://github.com/DuarteSantos8/openGym /tmp/openGym
            bash /tmp/openGym/scripts/fetch-media.sh /tmp/openGym/media
            ./tool/sync_media.sh /tmp/openGym/media
          fi
          test "$(find assets/img -type f | wc -l)" -eq 1324
          test "$(find assets/gif -type f | wc -l)" -eq 1324

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # The ported openGym suites run here: a translation that drifts fails the build rather
        # than reaching a tester's phone.
        run: flutter test

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build the release APK
        # Split per ABI, and distribute the arm64 one. A fat APK carries three copies of the
        # native libraries on top of ~137 MB of exercise media — about 50 MB of payload no
        # phone will ever execute. Every 64-bit Android device since 2015 takes this one.
        #
        # The build number is the run number, so versionCode strictly increases — Android
        # refuses to install an update whose code did not go up.
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Distribute to testers
        env:
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GROUPS: ${{ inputs.groups || 'testers' }}
          NOTES: ${{ inputs.notes || github.event.head_commit.message }}
        run: |
          npx --yes firebase-tools@latest appdistribution:distribute \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --app "$APP_ID" \
            --groups "$GROUPS" \
            --release-notes "$NOTES"

      - name: Keep the APK on the run
        uses: actions/upload-artifact@v4
        with:
          name: myOpenGym-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
          compression-level: 0

      - name: Remove the signing key
        if: always()
        run: rm -f android/app/upload.jks android/key.properties
