name: my_open_gym
description: "openGym, rebuilt in Flutter — a personal gym & body-weight tracker."
publish_to: 'none'

# Kept in step with the openGym release this was translated from (frontend/package.json 1.2.4).
# The build number is overridden by CI (--build-number) so it strictly increases per release.
version: 1.2.4+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # state + routing
  flutter_riverpod: ^3.0.3
  go_router: ^17.2.1

  # persistence — SharedPreferences is the primary copy, the JSON file mirror the durable one
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # rendering: the icon set and the body map are SVG path strings painted by CustomPainter
  path_drawing: ^1.0.1

  # platform
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  wakelock_plus: ^1.3.2
  share_plus: ^12.0.1
  file_picker: ^10.3.4
  audioplayers: ^6.5.1
  vibration: ^3.1.4
  printing: ^5.14.2
  pdf: ^3.11.3

  intl: ^0.20.2

  # Meal photos — the only feature that touches the network, and only with the user's own API key.
  # http rather than dart:io's HttpClient because its Client is injectable, which is what lets the
  # provider adapters be tested without a socket and without a mocking library.
  http: ^1.6.0
  # The API keys, in the platform keychain. Never in AppState — see lib/data/ai/ai_key_store.dart.
  # Held at 10.x deliberately: 11.x pulls win32 ^6 through its Windows implementation and
  # share_plus 12 pins win32 ^5, so the two cannot co-exist. Neither package's Windows half is
  # reachable from an Android/iOS build, but pub still has to solve for it.
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/i18n/
    - assets/instr/
    - assets/audio/
    # 1,324 stills + 1,324 animations, populated by tool/sync_media.sh (git-ignored)
    - assets/img/
    - assets/gif/
    # Food photography, populated by tool/sync_food_media.sh from tool/food_media.tsv
    # (git-ignored). Absent art falls back to a category glyph, so a checkout without it runs.
    - assets/food/
    - assets/branding/

# The app mark: openGym's dumbbell glyph on its own background, so the launcher icon, the
# splash and the sign-in logo are visibly the same thing.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0c0e12"
  adaptive_icon_foreground: assets/branding/icon-foreground.png

flutter_native_splash:
  color: "#0c0e12"
  color_dark: "#0c0e12"
  image: assets/branding/icon.png
  android_12:
    color: "#0c0e12"
    image: assets/branding/icon-foreground.png
